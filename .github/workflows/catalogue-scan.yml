name: FCC Catalogue Parser Test 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          npm install playwright cheerio
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # CAPTURE + PARSE FCC CATALOGUE
      # ----------------------------------------

      - name: Parse FCC catalogue
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            try {

              console.log('========================================');
              console.log('FCC CATALOGUE PARSER TEST 2');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('');
              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              await page.locator(
                'select[name="empower_global_term_id"]'
              ).selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              // ----------------------------------------
              // LEAVE DEPARTMENT + COURSE BLANK
              // ----------------------------------------

              console.log('✓ Department: ALL');
              console.log('✓ Course: ALL');

              // ----------------------------------------
              // WAIT FOR GETLIST RESPONSE
              // ----------------------------------------

              const responsePromise =
                page.waitForResponse(
                  response => {
                    return response.url().includes(
                      '/cfcs/courseCatalog.cfc?method=GetList'
                    );
                  },
                  {
                    timeout: 60000
                  }
                );

              // ----------------------------------------
              // SEARCH
              // ----------------------------------------

              await page.locator(
                'button[name="search"]'
              ).click();

              console.log('✓ Search clicked');

              const response =
                await responsePromise;

              console.log(
                `✓ GetList response received`
              );

              console.log(
                `Status: ${response.status()}`
              );

              // ----------------------------------------
              // READ RESPONSE
              // ----------------------------------------

              const responseText =
                await response.text();

              let payload;

              try {

                payload =
                  JSON.parse(responseText);

              } catch {

                throw new Error(
                  'FCC response was not valid JSON.'
                );

              }

              if (
                !payload.SUCCESS ||
                typeof payload.html !== 'string'
              ) {

                throw new Error(
                  'FCC response did not contain the expected SUCCESS/html structure.'
                );

              }

              const html =
                payload.html;

              console.log(
                `Catalogue HTML size: ${html.length} characters`
              );

              // ----------------------------------------
              // SAVE RAW HTML
              // ----------------------------------------

              fs.writeFileSync(
                'fcc-catalogue-response.html',
                html
              );

              console.log(
                '✓ Raw catalogue HTML saved.'
              );

              // ----------------------------------------
              // LOAD HTML
              // ----------------------------------------

              const $ =
                cheerio.load(html);

              const rows =
                $('div.ui-grid-row');

              console.log('');
              console.log('========================================');
              console.log('CATALOGUE STRUCTURE');
              console.log('========================================');

              console.log(
                `Grid rows found: ${rows.length}`
              );

              // ----------------------------------------
              // HELPERS
              // ----------------------------------------

              function clean(value) {

                return String(value || '')
                  .replace(/\u00a0/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();

              }

              function getColumns(row) {

                const values = [];

                $(row)
                  .find('div[class*="ui-grid-col-"]')
                  .each((index, element) => {

                    values.push(
                      clean($(element).text())
                    );

                  });

                return values;

              }

              function extractCourse(value) {

                const match =
                  value.match(
                    /\b([A-Z]{2,6}\s*\d{3,4}\s+[A-Za-z0-9]+)\b/
                  );

                return match
                  ? clean(match[1])
                  : null;

              }

              function isCourseRow(columns, text) {

                if (
                  !columns[1] ||
                  !text
                ) {

                  return false;

                }

                return !!extractCourse(
                  columns[1]
                );

              }

              // ----------------------------------------
              // READ ALL ROWS
              // ----------------------------------------

              const parsedRows = [];

              rows.each((index, element) => {

                const columns =
                  getColumns(element);

                const text =
                  clean($(element).text());

                if (!text) {
                  return;
                }

                parsedRows.push({
                  index,
                  columns,
                  text,
                  course:
                    extractCourse(
                      columns[1] || ''
                    ),
                  isCourse:
                    isCourseRow(
                      columns,
                      text
                    )
                });

              });

              console.log(
                `Non-empty rows: ${parsedRows.length}`
              );

              console.log(
                `Course rows: ${
                  parsedRows.filter(
                    row => row.isCourse
                  ).length
                }`
              );

              // ----------------------------------------
              // GROUP CONTINUATION ROWS
              // ----------------------------------------

              const records = [];

              let current = null;

              for (const row of parsedRows) {

                if (row.isCourse) {

                  if (current) {
                    records.push(current);
                  }

                  current = {
                    course: row.course,
                    rows: [row]
                  };

                } else if (current) {

                  current.rows.push(row);

                }

              }

              if (current) {
                records.push(current);
              }

              console.log('');
              console.log('========================================');
              console.log('SECTION GROUPING');
              console.log('========================================');

              console.log(
                `Sections detected: ${records.length}`
              );

              // ----------------------------------------
              // BUILD STRUCTURED SECTIONS
              // ----------------------------------------

              const sections = [];

              for (const record of records) {

                const mainRow =
                  record.rows[0];

                const main =
                  mainRow.columns;

                /*
                 * MAIN ROW
                 *
                 * 0 = icon
                 * 1 = course
                 * 2 = credits
                 * 3 = classroom
                 * 4 = schedule
                 * 5 = instructor
                 * 6 = enrolled
                 * 7 = available
                 * 8 = offer
                 *
                 * CONTINUATION ROW
                 *
                 * 0 = icon / blank
                 * 1 = classroom
                 * 2 = schedule
                 * 3 = instructor
                 * 4 = enrolled
                 * 5 = available
                 * 6 = offer
                 */

                const section = {

                  section:
                    record.course,

                  credits:
                    clean(main[2]),

                  meetings: [],

                  instructor:
                    clean(main[5]),

                  enrolled:
                    clean(main[6]),

                  available:
                    clean(main[7]),

                  offer:
                    clean(main[8])

                };

                // ----------------------------------------
                // MAIN MEETING
                // ----------------------------------------

                if (
                  main[3] ||
                  main[4]
                ) {

                  section.meetings.push({

                    classroom:
                      clean(main[3]),

                    schedule:
                      clean(main[4])

                  });

                }

                // ----------------------------------------
                // CONTINUATION MEETINGS
                // ----------------------------------------

                for (
                  let r = 1;
                  r < record.rows.length;
                  r++
                ) {

                  const columns =
                    record.rows[r].columns;

                  /*
                   * Continuation rows observed
                   * in the FCC response:
                   *
                   * 0 = blank/icon
                   * 1 = classroom
                   * 2 = schedule
                   * 3 = instructor
                   * 4 = enrolled
                   * 5 = available
                   * 6 = offer
                   */

                  const classroom =
                    clean(columns[1]);

                  const schedule =
                    clean(columns[2]);

                  const instructor =
                    clean(columns[3]);

                  const enrolled =
                    clean(columns[4]);

                  const available =
                    clean(columns[5]);

                  const offer =
                    clean(columns[6]);

                  if (
                    classroom ||
                    schedule
                  ) {

                    section.meetings.push({

                      classroom,

                      schedule

                    });

                  }

                  // ----------------------------------------
                  // FILL SECTION-LEVEL VALUES
                  // ----------------------------------------

                  if (
                    instructor &&
                    !section.instructor
                  ) {

                    section.instructor =
                      instructor;

                  }

                  /*
                   * Only use continuation-row
                   * enrollment/availability when
                   * the main row doesn't already
                   * provide them.
                   */

                  if (
                    !section.enrolled &&
                    /^\d+$/.test(enrolled)
                  ) {

                    section.enrolled =
                      enrolled;

                  }

                  if (
                    !section.available &&
                    /^\d+$/.test(available)
                  ) {

                    section.available =
                      available;

                  }

                  if (
                    !section.offer &&
                    offer
                  ) {

                    section.offer =
                      offer;

                  }

                }

                sections.push(section);

              }

              // ----------------------------------------
              // PRINT FIRST 20 SECTIONS
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('FIRST 20 PARSED SECTIONS');
              console.log('========================================');

              for (
                let i = 0;
                i < Math.min(
                  20,
                  sections.length
                );
                i++
              ) {

                const section =
                  sections[i];

                console.log('');
                console.log(
                  `---------- SECTION ${i + 1} ----------`
                );

                console.log(
                  `Course: ${section.section}`
                );

                console.log(
                  `Credits: ${section.credits}`
                );

                console.log(
                  `Instructor: ${section.instructor}`
                );

                console.log(
                  `Enrolled: ${section.enrolled}`
                );

                console.log(
                  `Available: ${section.available}`
                );

                console.log(
                  `Offer: ${section.offer}`
                );

                console.log(
                  `Meetings: ${section.meetings.length}`
                );

                for (
                  const meeting of section.meetings
                ) {

                  console.log(
                    `  Classroom: ${
                      meeting.classroom
                    }`
                  );

                  console.log(
                    `  Schedule: ${
                      meeting.schedule
                    }`
                  );

                }

              }

              // ----------------------------------------
              // SPECIFIC BIOL 100 CHECK
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('BIOL 100 CHECK');
              console.log('========================================');

              const biol100 =
                sections.filter(
                  section =>
                    /^BIOL\s*100\b/i.test(
                      section.section
                    )
                );

              console.log(
                `BIOL 100 sections found: ${biol100.length}`
              );

              for (
                const section of biol100.slice(0, 5)
              ) {

                console.log('');
                console.log(
                  section.section
                );

                console.log(
                  `Instructor: ${
                    section.instructor
                  }`
                );

                console.log(
                  `Enrolled: ${
                    section.enrolled
                  }`
                );

                console.log(
                  `Available: ${
                    section.available
                  }`
                );

                console.log(
                  `Meetings:`
                );

                for (
                  const meeting of section.meetings
                ) {

                  console.log(
                    `  ${
                      meeting.classroom
                    } | ${
                      meeting.schedule
                    }`
                  );

                }

              }

              // ----------------------------------------
              // SAVE STRUCTURED JSON
              // ----------------------------------------

              fs.writeFileSync(
                'fcc-sections.json',
                JSON.stringify(
                  sections,
                  null,
                  2
                )
              );

              console.log('');
              console.log(
                '✓ Structured sections saved.'
              );

              // ----------------------------------------
              // SUMMARY
              // ----------------------------------------

              const multiMeeting =
                sections.filter(
                  section =>
                    section.meetings.length > 1
                );

              console.log('');
              console.log('========================================');
              console.log('PARSER TEST 2 COMPLETE');
              console.log('========================================');

              console.log(
                `Raw rows: ${rows.length}`
              );

              console.log(
                `Parsed sections: ${sections.length}`
              );

              console.log(
                `Sections with multiple meetings: ${
                  multiMeeting.length
                }`
              );

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(error);

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # SAVE RAW HTML
      # ----------------------------------------

      - name: Save raw catalogue HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-catalogue-response-test-2
          path: fcc-catalogue-response.html
          retention-days: 3

      # ----------------------------------------
      # SAVE PARSED JSON
      # ----------------------------------------

      - name: Save parsed sections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-parsed-sections-test-2
          path: fcc-sections.json
          retention-days: 3
