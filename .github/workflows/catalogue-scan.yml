name: FCC Full Catalogue Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          npm install playwright nodemailer
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # CHECK FCC
      # ----------------------------------------

      - name: Check FCC course availability
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          const nodemailer = require('nodemailer');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            try {

              console.log('========================================');
              console.log('FCC FULL CATALOGUE MONITOR');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              const term = page.locator(
                'select[name="empower_global_term_id"]'
              );

              await term.selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              // ----------------------------------------
              // SEARCH FULL CATALOGUE
              // ----------------------------------------
              //
              // Department and course are intentionally
              // left blank so the entire catalogue is
              // returned.
              //
              // ----------------------------------------

              const search = page.locator(
                'button[name="search"]'
              );

              await search.waitFor({
                state: 'visible',
                timeout: 30000
              });

              await search.click();

              console.log(
                '✓ Full catalogue search clicked'
              );

              // ----------------------------------------
              // WAIT FOR CATALOGUE RESULTS
              // ----------------------------------------
              //
              // FCC loads the results dynamically into
              // #courses.
              //
              // ----------------------------------------

              const courseContainer =
                page.locator('#courses');

              await courseContainer.waitFor({
                state: 'attached',
                timeout: 60000
              });

              const courseRows =
                page.locator(
                  '#courses div.ui-grid-row'
                );

              await courseRows.first().waitFor({
                state: 'attached',
                timeout: 60000
              });

              // Small buffer to ensure all dynamically
              // inserted continuation rows are present.

              await page.waitForTimeout(1500);

              console.log(
                '✓ Catalogue results loaded'
              );

              // ----------------------------------------
              // FIND COURSE ROWS
              // ----------------------------------------

              const rows =
                page.locator(
                  '#courses div.ui-grid-row'
                );

              const rowCount =
                await rows.count();

              console.log('');
              console.log(
                `Raw catalogue rows: ${rowCount}`
              );

              // ----------------------------------------
              // COURSE IDENTIFIER
              // ----------------------------------------
              //
              // Matches course/section combinations
              // without hard-coding section letters.
              //
              // Examples:
              //
              // ARTS 101 A
              // BIOL 100 A
              // BIOT 699A A
              // CHEM 799E B
              // PHYS COMP A
              //
              // ----------------------------------------

              function extractSection(
                courseText
              ) {

                const normalized =
                  courseText
                    .replace(/\u00a0/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();

                const match =
                  normalized.match(
                    /^([A-Za-z]{2,8})\s+([A-Za-z0-9]{2,8})\s+([A-Za-z0-9]+)\b/
                  );

                if (!match) {
                  return null;
                }

                return `${match[1]} ${match[2]} ${match[3]}`
                  .toUpperCase();
              }

              // ----------------------------------------
              // PARSE CATALOGUE
              // ----------------------------------------
              //
              // FCC uses two row structures:
              //
              // 1. Normal course rows
              //
              // 2. Continuation rows for courses with
              //    multiple meeting times.
              //
              // We process both in a single pass.
              //
              // ----------------------------------------

              const parsedSections = [];

              let currentSection = null;

              let continuationRows = 0;

              let unrecognizedRows = 0;

              for (
                let i = 0;
                i < rowCount;
                i++
              ) {

                const row =
                  rows.nth(i);

                const columns =
                  row.locator(
                    'div[class*="ui-grid-col-"]'
                  );

                const columnCount =
                  await columns.count();

                const values = [];

                for (
                  let c = 0;
                  c < columnCount;
                  c++
                ) {

                  const value =
                    (
                      await columns
                        .nth(c)
                        .innerText()
                    )
                      .replace(/\u00a0/g, ' ')
                      .replace(/\s+/g, ' ')
                      .trim();

                  values.push(value);
                }

                // ----------------------------------------
                // TRY TO IDENTIFY A COURSE ROW
                // ----------------------------------------

                const courseText =
                  values.length >= 2
                    ? values[1] || ''
                    : '';

                const section =
                  extractSection(
                    courseText
                  );

                // ----------------------------------------
                // NEW COURSE SECTION
                // ----------------------------------------

                if (section) {

                  currentSection = {
                    section,
                    location:
                      values[3] || '',
                    schedule:
                      values[4] || '',
                    instructor:
                      values[5] || '',
                    enrolled:
                      '',
                    available:
                      null,
                    offer:
                      ''
                  };

                  // --------------------------------------
                  // NORMAL COURSE ROW
                  // --------------------------------------

                  if (
                    values.length >= 8
                  ) {

                    currentSection.offer =
                      values[6] || '';

                    const available =
                      parseInt(
                        values[7],
                        10
                      );

                    if (
                      !Number.isNaN(
                        available
                      )
                    ) {

                      currentSection.available =
                        available;

                    }

                  }

                  // Save the section immediately.
                  parsedSections.push(
                    currentSection
                  );

                  continue;
                }

                // ----------------------------------------
                // CONTINUATION ROW
                // ----------------------------------------
                //
                // These belong to the preceding course
                // and may contain its availability.
                //
                // ----------------------------------------

                if (
                  currentSection &&
                  values.length === 7
                ) {

                  const possibleAvailable =
                    parseInt(
                      values[5],
                      10
                    );

                  if (
                    !Number.isNaN(
                      possibleAvailable
                    )
                  ) {

                    continuationRows++;

                    if (
                      currentSection.available ===
                      null
                    ) {

                      currentSection.available =
                        possibleAvailable;

                      currentSection.offer =
                        values[4] || '';

                    }

                  }

                  continue;
                }

                // ----------------------------------------
                // UNRECOGNIZED ROW
                // ----------------------------------------

                const rowText =
                  values
                    .join(' ')
                    .trim();

                if (
                  rowText &&
                  rowText !== 'Course'
                ) {

                  unrecognizedRows++;

                }

              }

              // ----------------------------------------
              // DEDUPLICATE SECTIONS
              // ----------------------------------------

              const finalSections = [];

              const seenSections =
                new Set();

              for (
                const section
                  of parsedSections
              ) {

                if (
                  seenSections.has(
                    section.section
                  )
                ) {

                  continue;

                }

                seenSections.add(
                  section.section
                );

                if (
                  section.available === null
                ) {

                  section.available = 0;

                }

                finalSections.push(
                  section
                );

              }

              // ----------------------------------------
              // PARSING RESULTS
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('CATALOGUE PARSING RESULTS');
              console.log('========================================');

              console.log(
                `Raw catalogue rows: ${rowCount}`
              );

              console.log(
                `Unique catalogue sections: ${finalSections.length}`
              );

              console.log(
                `Continuation meeting rows: ${continuationRows}`
              );

              console.log(
                `Unrecognized non-empty rows: ${unrecognizedRows}`
              );

              // ----------------------------------------
              // LOAD PREVIOUS STATE
              // ----------------------------------------

              const stateFile =
                'fcc-catalogue-state.json';

              let previousState = null;

              if (
                fs.existsSync(stateFile)
              ) {

                try {

                  previousState =
                    JSON.parse(
                      fs.readFileSync(
                        stateFile,
                        'utf8'
                      )
                    );

                  console.log('');
                  console.log(
                    '✓ Previous state loaded.'
                  );

                } catch {

                  console.log('');
                  console.log(
                    '⚠ Previous state could not be read.'
                  );

                }

              } else {

                console.log('');
                console.log(
                  'No previous state found.'
                );

              }

              const previousSectionCount =
                previousState
                  ? Object.keys(
                      previousState.sections || {}
                    ).length
                  : 0;

              // ----------------------------------------
              // PARSER VERSION
              // ----------------------------------------

              const PARSER_VERSION = 2;

              const parserMigration =
                !previousState ||
                previousState.parserVersion !==
                  PARSER_VERSION;

              if (
                parserMigration
              ) {

                console.log('');
                console.log(
                  '========================================'
                );

                console.log(
                  'PARSER VERSION CHANGE'
                );

                console.log(
                  '========================================'
                );

                console.log(
                  `Previous parser version: ${
                    previousState?.parserVersion || 'none'
                  }`
                );

                console.log(
                  `Current parser version: ${PARSER_VERSION}`
                );

                console.log(
                  'Corrected parser will establish a new baseline.'
                );

              }

              // ----------------------------------------
              // SAFETY CHECK
              // ----------------------------------------
              //
              // Never overwrite a good state if a normal
              // run suddenly returns less than 80% of the
              // previous catalogue.
              //
              // Parser migration is exempt because the
              // section count is intentionally changing.
              //
              // ----------------------------------------

              if (
                previousState &&
                !parserMigration &&
                previousSectionCount >= 100 &&
                finalSections.length <
                  previousSectionCount * 0.8
              ) {

                throw new Error(
                  `Suspicious catalogue drop detected. Previous sections: ${previousSectionCount}. Current sections: ${finalSections.length}. State file will NOT be overwritten.`
                );

              }

              // ----------------------------------------
              // BUILD CURRENT STATE
              // ----------------------------------------

              const currentState = {
                parserVersion:
                  PARSER_VERSION,

                updatedAt:
                  new Date().toISOString(),

                sections: {}
              };

              for (
                const section
                  of finalSections
              ) {

                currentState.sections[
                  section.section
                ] = {
                  available:
                    section.available,

                  enrolled:
                    section.enrolled,

                  location:
                    section.location,

                  schedule:
                    section.schedule,

                  instructor:
                    section.instructor,

                  offer:
                    section.offer
                };

              }

              // ----------------------------------------
              // DETECT CHANGES
              // ----------------------------------------

              let newSections = [];

              let newlyAvailable = [];

              // During parser migration, establish the
              // corrected baseline without alerts.

              if (
                previousState &&
                !parserMigration
              ) {

                for (
                  const section
                    of finalSections
                ) {

                  const available =
                    section.available;

                  const previous =
                    previousState
                      .sections?.[
                        section.section
                      ];

                  // Completely new section

                  if (!previous) {

                    newSections.push(
                      section
                    );

                  }

                  // Existing section went from
                  // 0 available seats to >0.

                  if (
                    previous &&
                    previous.available === 0 &&
                    available > 0
                  ) {

                    newlyAvailable.push(
                      section
                    );

                  }

                }

              }

              // ----------------------------------------
              // DISPLAY CHANGES
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('CHANGES');
              console.log('========================================');

              console.log(
                `Previous sections: ${previousSectionCount}`
              );

              console.log(
                `Current sections: ${finalSections.length}`
              );

              console.log(
                `New sections: ${newSections.length}`
              );

              console.log(
                `Newly available: ${newlyAvailable.length}`
              );

              // ----------------------------------------
              // SEND ALERT
              // ----------------------------------------

              if (
                newSections.length > 0 ||
                newlyAvailable.length > 0
              ) {

                const alertSections = [];

                // New sections

                for (
                  const section
                    of newSections
                ) {

                  alertSections.push({
                    ...section,
                    reason:
                      'NEW SECTION'
                  });

                }

                // Newly available seats

                for (
                  const section
                    of newlyAvailable
                ) {

                  const alreadyIncluded =
                    alertSections.some(
                      item =>
                        item.section ===
                        section.section
                    );

                  if (
                    !alreadyIncluded
                  ) {

                    alertSections.push({
                      ...section,
                      reason:
                        'SEATS AVAILABLE'
                    });

                  }

                }

                let emailText =
                  'FCC COURSE ALERT\n\n';

                emailText +=
                  '2026 Fall - Full Catalogue\n\n';

                for (
                  const section
                    of alertSections
                ) {

                  emailText +=
                    '----------------------------------------\n';

                  emailText +=
                    `${section.reason}\n`;

                  emailText +=
                    `${section.section}\n`;

                  emailText +=
                    `Location: ${section.location}\n`;

                  emailText +=
                    `Schedule: ${section.schedule}\n`;

                  emailText +=
                    `Instructor: ${section.instructor}\n`;

                  emailText +=
                    `Available: ${section.available}\n`;

                  emailText +=
                    `Offer: ${section.offer}\n\n`;

                }

                emailText +=
                  'Check the FCC course catalogue now.';

                // ----------------------------------------
                // GMAIL
                // ----------------------------------------

                console.log('');
                console.log(
                  'Sending alert email...'
                );

                const transporter =
                  nodemailer.createTransport({
                    service: 'gmail',

                    auth: {
                      user:
                        process.env.SMTP_USER,

                      pass:
                        process.env.SMTP_PASSWORD
                    }
                  });

                await transporter.sendMail({

                  from:
                    process.env.SMTP_USER,

                  to:
                    process.env.ALERT_EMAIL,

                  subject:
                    `🚨 FCC Alert: Course catalogue update — ${new Date().toLocaleString('en-PK')}`,

                  text:
                    emailText

                });

                console.log(
                  '✓ Alert email sent successfully.'
                );

              } else {

                console.log('');
                console.log(
                  'No new sections or newly available seats.'
                );

              }

              // ----------------------------------------
              // SAVE CURRENT STATE
              // ----------------------------------------

              fs.writeFileSync(
                stateFile,
                JSON.stringify(
                  currentState,
                  null,
                  2
                )
              );

              console.log(
                '✓ Current state saved.'
              );

              // ----------------------------------------
              // SCREENSHOT
              // ----------------------------------------

              await page.screenshot({
                path:
                  'fcc-course-results.png',

                fullPage:
                  true
              });

              console.log('');
              console.log('========================================');
              console.log('MONITOR COMPLETE');
              console.log('========================================');

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(
                error
              );

              try {

                await page.screenshot({
                  path:
                    'fcc-error.png',

                  fullPage:
                    true
                });

              } catch {}

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # COMMIT UPDATED STATE
      # ----------------------------------------

      - name: Save monitoring state
        run: |
          git config user.name "FCC Course Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fcc-catalogue-state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update FCC catalogue monitoring state"
            git push
          fi

      # ----------------------------------------
      # SAVE COURSE RESULTS SCREENSHOT
      # ----------------------------------------

      - name: Save course results screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-course-results
          path: fcc-course-results.png
          retention-days: 3

      # ----------------------------------------
      # SAVE ERROR SCREENSHOT
      # ----------------------------------------

      - name: Save error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-error
          path: fcc-error.png
          retention-days: 3
