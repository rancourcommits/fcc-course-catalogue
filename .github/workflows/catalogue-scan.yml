name: FCC Catalogue Network Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL PLAYWRIGHT
      # ----------------------------------------

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # INSPECT FCC NETWORK REQUESTS
      # ----------------------------------------

      - name: Inspect FCC catalogue requests
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            const requests = [];
            const responses = [];

            // ----------------------------------------
            // CAPTURE REQUESTS
            // ----------------------------------------

            page.on('request', request => {

              const type = request.resourceType();

              if (
                type === 'xhr' ||
                type === 'fetch'
              ) {

                requests.push({
                  method: request.method(),
                  url: request.url(),
                  postData: request.postData()
                });

              }

            });

            // ----------------------------------------
            // CAPTURE RESPONSES
            // ----------------------------------------

            page.on('response', async response => {

              const request = response.request();
              const type = request.resourceType();

              if (
                type === 'xhr' ||
                type === 'fetch'
              ) {

                let body = '';

                try {
                  body = await response.text();
                } catch {}

                responses.push({
                  status: response.status(),
                  url: response.url(),
                  contentType:
                    response.headers()['content-type'] || '',
                  body: body.slice(0, 5000)
                });

              }

            });

            try {

              console.log('========================================');
              console.log('FCC CATALOGUE NETWORK TEST');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('');
              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              const term = page.locator(
                'select[name="empower_global_term_id"]'
              );

              await term.selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              // ----------------------------------------
              // LEAVE DEPARTMENT BLANK
              // ----------------------------------------

              console.log('✓ Department: ALL');

              // ----------------------------------------
              // LEAVE COURSE BLANK
              // ----------------------------------------

              console.log('✓ Course: ALL');

              // ----------------------------------------
              // CLEAR ANY REQUESTS FROM PAGE LOAD
              // ----------------------------------------

              requests.length = 0;
              responses.length = 0;

              console.log('');
              console.log(
                '✓ Network log cleared before Search.'
              );

              // ----------------------------------------
              // SEARCH
              // ----------------------------------------

              const search = page.locator(
                'button[name="search"]'
              );

              await search.waitFor({
                state: 'visible',
                timeout: 30000
              });

              console.log('');
              console.log('Clicking Search...');

              await search.click();

              console.log('✓ Search clicked');

              // ----------------------------------------
              // WAIT FOR NETWORK + RESULTS
              // ----------------------------------------

              await page.waitForTimeout(7000);

              // ----------------------------------------
              // REQUEST RESULTS
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('NETWORK REQUESTS');
              console.log('========================================');

              console.log(
                `XHR/fetch requests captured: ${requests.length}`
              );

              for (
                let i = 0;
                i < requests.length;
                i++
              ) {

                const request = requests[i];

                console.log('');
                console.log(
                  `---------- REQUEST ${i + 1} ----------`
                );

                console.log(
                  `METHOD: ${request.method}`
                );

                console.log(
                  `URL: ${request.url}`
                );

                if (request.postData) {

                  console.log(
                    'POST DATA:'
                  );

                  console.log(
                    request.postData
                  );

                } else {

                  console.log(
                    'POST DATA: <none>'
                  );

                }

              }

              // ----------------------------------------
              // RESPONSE RESULTS
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('NETWORK RESPONSES');
              console.log('========================================');

              console.log(
                `XHR/fetch responses captured: ${responses.length}`
              );

              for (
                let i = 0;
                i < responses.length;
                i++
              ) {

                const response = responses[i];

                console.log('');
                console.log(
                  `---------- RESPONSE ${i + 1} ----------`
                );

                console.log(
                  `STATUS: ${response.status}`
                );

                console.log(
                  `URL: ${response.url}`
                );

                console.log(
                  `CONTENT TYPE: ${response.contentType}`
                );

                console.log(
                  'BODY PREVIEW:'
                );

                console.log(
                  response.body || '<empty>'
                );

              }

              // ----------------------------------------
              // CONFIRM RESULTS
              // ----------------------------------------

              const courses =
                page.locator('#courses');

              const courseHtml =
                await courses.innerHTML();

              console.log('');
              console.log('========================================');
              console.log('RESULT CONTAINER');
              console.log('========================================');

              console.log(
                `#courses HTML length: ${courseHtml.length}`
              );

              console.log(
                `#courses text length: ${
                  (await courses.innerText()).length
                }`
              );

              console.log(
                `ui-grid-row count: ${
                  await page.locator(
                    'div.ui-grid-row'
                  ).count()
                }`
              );

              // ----------------------------------------
              // SAVE LIVE RESULTS HTML
              // ----------------------------------------

              await require('fs').promises.writeFile(
                'fcc-live-courses.html',
                courseHtml
              );

              console.log('');
              console.log(
                '✓ Saved live #courses HTML.'
              );

              // ----------------------------------------
              // SAVE SCREENSHOT
              // ----------------------------------------

              await page.screenshot({
                path: 'fcc-network-test.png',
                fullPage: true
              });

              console.log('');
              console.log('========================================');
              console.log('NETWORK TEST COMPLETE');
              console.log('========================================');

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(error);

              try {

                await page.screenshot({
                  path: 'fcc-error.png',
                  fullPage: true
                });

              } catch {}

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # SAVE LIVE HTML
      # ----------------------------------------

      - name: Save live catalogue HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-live-courses-html
          path: fcc-live-courses.html
          retention-days: 3

      # ----------------------------------------
      # SAVE SCREENSHOT
      # ----------------------------------------

      - name: Save network test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-network-test
          path: fcc-network-test.png
          retention-days: 3

      # ----------------------------------------
      # SAVE ERROR SCREENSHOT
      # ----------------------------------------

      - name: Save error screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-error
          path: fcc-error.png
          retention-days: 3
