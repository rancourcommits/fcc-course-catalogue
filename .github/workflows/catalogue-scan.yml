name: FCC Full Catalogue Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          npm install playwright cheerio nodemailer
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # CHECK FCC CATALOGUE
      # ----------------------------------------

      - name: Check FCC catalogue
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const nodemailer = require('nodemailer');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            try {

              console.log('========================================');
              console.log('FCC FULL CATALOGUE MONITOR');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('');
              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              await page.locator(
                'select[name="empower_global_term_id"]'
              ).selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              // ----------------------------------------
              // DEPARTMENT + COURSE
              // ----------------------------------------

              console.log('✓ Department: ALL');
              console.log('✓ Course: ALL');

              // ----------------------------------------
              // CAPTURE GETLIST RESPONSE
              // ----------------------------------------

              console.log('');
              console.log(
                'Waiting for FCC catalogue response...'
              );

              const responsePromise =
                page.waitForResponse(
                  response => {
                    return response.url().includes(
                      '/cfcs/courseCatalog.cfc?method=GetList'
                    );
                  },
                  {
                    timeout: 60000
                  }
                );

              // ----------------------------------------
              // SEARCH
              // ----------------------------------------

              await page.locator(
                'button[name="search"]'
              ).click();

              console.log('✓ Search clicked');

              const response =
                await responsePromise;

              console.log(
                '✓ GetList response received'
              );

              console.log(
                `Status: ${response.status()}`
              );

              // ----------------------------------------
              // READ RESPONSE
              // ----------------------------------------

              const responseText =
                await response.text();

              let payload;

              try {

                payload =
                  JSON.parse(responseText);

              } catch {

                throw new Error(
                  'FCC response was not valid JSON.'
                );

              }

              if (
                !payload.SUCCESS ||
                typeof payload.html !== 'string'
              ) {

                throw new Error(
                  'FCC response did not contain the expected SUCCESS/html structure.'
                );

              }

              const html =
                payload.html;

              console.log(
                `Catalogue HTML size: ${html.length} characters`
              );

              // ----------------------------------------
              // PARSE HTML
              // ----------------------------------------

              const $ =
                cheerio.load(html);

              const rows =
                $('div.ui-grid-row');

              console.log(
                `Raw catalogue rows: ${rows.length}`
              );

              // ----------------------------------------
              // HELPERS
              // ----------------------------------------

              function clean(value) {

                return String(value || '')
                  .replace(/\u00a0/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();

              }

              function getColumns(row) {

                const values = [];

                $(row)
                  .find('div[class*="ui-grid-col-"]')
                  .each((index, element) => {

                    values.push(
                      clean($(element).text())
                    );

                  });

                return values;

              }

              function extractCourse(value) {

                const match =
                  value.match(
                    /\b([A-Z]{2,6}\s*\d{3,4}\s+[A-Za-z0-9]+)\b/
                  );

                return match
                  ? clean(match[1])
                  : null;

              }

              function isCourseRow(columns) {

                return !!extractCourse(
                  columns[1] || ''
                );

              }

              // ----------------------------------------
              // READ ROWS
              // ----------------------------------------

              const parsedRows = [];

              rows.each((index, element) => {

                const columns =
                  getColumns(element);

                const text =
                  clean($(element).text());

                if (!text) {
                  return;
                }

                parsedRows.push({
                  index,
                  columns,
                  text,
                  course:
                    extractCourse(
                      columns[1] || ''
                    ),
                  isCourse:
                    isCourseRow(columns)
                });

              });

              // ----------------------------------------
              // GROUP COURSE + CONTINUATION ROWS
              // ----------------------------------------

              const records = [];

              let current = null;

              for (const row of parsedRows) {

                if (row.isCourse) {

                  if (current) {
                    records.push(current);
                  }

                  current = {
                    course: row.course,
                    rows: [row]
                  };

                } else if (current) {

                  current.rows.push(row);

                }

              }

              if (current) {
                records.push(current);
              }

              console.log(
                `Catalogue sections detected: ${records.length}`
              );

              // ----------------------------------------
              // BUILD STRUCTURED SECTIONS
              // ----------------------------------------

              const sections = [];

              for (const record of records) {

                const mainRow =
                  record.rows[0];

                const main =
                  mainRow.columns;

                const section = {

                  section:
                    record.course,

                  credits:
                    clean(main[2]),

                  meetings: [],

                  instructor:
                    clean(main[5]),

                  enrolled:
                    clean(main[6]),

                  available:
                    clean(main[7]),

                  offer:
                    clean(main[8])

                };

                // ----------------------------------------
                // MAIN MEETING
                // ----------------------------------------

                if (
                  main[3] ||
                  main[4]
                ) {

                  section.meetings.push({

                    classroom:
                      clean(main[3]),

                    schedule:
                      clean(main[4])

                  });

                }

                // ----------------------------------------
                // CONTINUATION MEETINGS
                // ----------------------------------------

                for (
                  let r = 1;
                  r < record.rows.length;
                  r++
                ) {

                  const columns =
                    record.rows[r].columns;

                  const classroom =
                    clean(columns[1]);

                  const schedule =
                    clean(columns[2]);

                  const instructor =
                    clean(columns[3]);

                  const enrolled =
                    clean(columns[4]);

                  const available =
                    clean(columns[5]);

                  const offer =
                    clean(columns[6]);

                  if (
                    classroom ||
                    schedule
                  ) {

                    section.meetings.push({

                      classroom,

                      schedule

                    });

                  }

                  if (
                    instructor &&
                    !section.instructor
                  ) {

                    section.instructor =
                      instructor;

                  }

                  if (
                    !section.enrolled &&
                    /^\d+$/.test(enrolled)
                  ) {

                    section.enrolled =
                      enrolled;

                  }

                  if (
                    !section.available &&
                    /^\d+$/.test(available)
                  ) {

                    section.available =
                      available;

                  }

                  if (
                    !section.offer &&
                    offer
                  ) {

                    section.offer =
                      offer;

                  }

                }

                sections.push(section);

              }

              console.log('');
              console.log('========================================');
              console.log('CURRENT CATALOGUE');
              console.log('========================================');

              console.log(
                `Total sections: ${sections.length}`
              );

              // ----------------------------------------
              // LOAD PREVIOUS STATE
              // ----------------------------------------

              const stateFile =
                'fcc-catalogue-state.json';

              let previousState = null;

              if (fs.existsSync(stateFile)) {

                try {

                  previousState =
                    JSON.parse(
                      fs.readFileSync(
                        stateFile,
                        'utf8'
                      )
                    );

                  console.log(
                    '✓ Previous state loaded.'
                  );

                } catch {

                  console.log(
                    '⚠ Previous state could not be read.'
                  );

                }

              } else {

                console.log(
                  'No previous state found. Establishing baseline.'
                );

              }

              // ----------------------------------------
              // BUILD CURRENT STATE
              // ----------------------------------------

              const currentState = {
                term: '2026 Fall',
                sections: {}
              };

              for (const section of sections) {

                const available =
                  parseInt(
                    section.available,
                    10
                  ) || 0;

                const enrolled =
                  parseInt(
                    section.enrolled,
                    10
                  ) || 0;

                currentState.sections[
                  section.section
                ] = {

                  available,

                  enrolled,

                  credits:
                    section.credits,

                  instructor:
                    section.instructor,

                  offer:
                    section.offer,

                  meetings:
                    section.meetings

                };

              }

              // ----------------------------------------
              // DETECT CHANGES
              // ----------------------------------------

              const newSections = [];
              const newlyAvailable = [];

              if (previousState) {

                for (const section of sections) {

                  const available =
                    parseInt(
                      section.available,
                      10
                    ) || 0;

                  const previous =
                    previousState.sections?.[
                      section.section
                    ];

                  // ----------------------------------------
                  // COMPLETELY NEW SECTION
                  // ----------------------------------------

                  if (!previous) {

                    newSections.push(section);

                    continue;

                  }

                  // ----------------------------------------
                  // 0 → >0 AVAILABLE
                  // ----------------------------------------

                  if (
                    previous.available === 0 &&
                    available > 0
                  ) {

                    newlyAvailable.push(section);

                  }

                }

              }

              console.log('');
              console.log('========================================');
              console.log('CHANGES');
              console.log('========================================');

              console.log(
                `New sections: ${newSections.length}`
              );

              console.log(
                `Newly available: ${newlyAvailable.length}`
              );

              // ----------------------------------------
              // SEND EMAIL ALERT
              // ----------------------------------------

              if (
                newSections.length > 0 ||
                newlyAvailable.length > 0
              ) {

                const alertSections = [];

                // ----------------------------------------
                // NEW SECTIONS
                // ----------------------------------------

                for (
                  const section of newSections
                ) {

                  alertSections.push({

                    ...section,

                    reason:
                      'NEW SECTION'

                  });

                }

                // ----------------------------------------
                // NEWLY AVAILABLE
                // ----------------------------------------

                for (
                  const section of newlyAvailable
                ) {

                  const alreadyIncluded =
                    alertSections.some(
                      item =>
                        item.section ===
                        section.section
                    );

                  if (!alreadyIncluded) {

                    alertSections.push({

                      ...section,

                      reason:
                        'SEATS AVAILABLE'

                    });

                  }

                }

                let emailText =
                  'FCC COURSE ALERT\n\n';

                emailText +=
                  '2026 Fall - Course Catalogue\n\n';

                emailText +=
                  `Updates detected: ${
                    alertSections.length
                  }\n\n`;

                for (
                  const section of alertSections
                ) {

                  emailText +=
                    '----------------------------------------\n';

                  emailText +=
                    `${section.reason}\n`;

                  emailText +=
                    `${section.section}\n`;

                  emailText +=
                    `Credits: ${
                      section.credits
                    }\n`;

                  emailText +=
                    `Instructor: ${
                      section.instructor
                    }\n`;

                  emailText +=
                    `Enrolled: ${
                      section.enrolled
                    }\n`;

                  emailText +=
                    `Available: ${
                      section.available
                    }\n`;

                  emailText +=
                    `Offer: ${
                      section.offer
                    }\n`;

                  emailText +=
                    'Meetings:\n';

                  for (
                    const meeting of
                    section.meetings
                  ) {

                    emailText +=
                      `  ${
                        meeting.classroom
                      } | ${
                        meeting.schedule
                      }\n`;

                  }

                  emailText += '\n';

                }

                emailText +=
                  'Check the FCC course catalogue now.';

                // ----------------------------------------
                // GMAIL
                // ----------------------------------------

                console.log('');
                console.log(
                  'Sending alert email...'
                );

                const transporter =
                  nodemailer.createTransport({

                    service: 'gmail',

                    auth: {

                      user:
                        process.env.SMTP_USER,

                      pass:
                        process.env.SMTP_PASSWORD

                    }

                  });

                await transporter.sendMail({

                  from:
                    process.env.SMTP_USER,

                  to:
                    process.env.ALERT_EMAIL,

                  subject:
                    '🚨 FCC Alert: Course catalogue update',

                  text:
                    emailText

                });

                console.log(
                  '✓ Alert email sent successfully.'
                );

              } else {

                console.log('');
                console.log(
                  'No new sections or newly available seats.'
                );

              }

              // ----------------------------------------
              // SAVE CURRENT STATE
              // ----------------------------------------

              fs.writeFileSync(

                stateFile,

                JSON.stringify(
                  currentState,
                  null,
                  2
                )

              );

              console.log(
                '✓ Current state saved.'
              );

              // ----------------------------------------
              // SAVE CATALOGUE HTML
              // ----------------------------------------

              fs.writeFileSync(
                'fcc-catalogue-response.html',
                html
              );

              console.log(
                '✓ Catalogue HTML saved.'
              );

              console.log('');
              console.log('========================================');
              console.log('MONITOR COMPLETE');
              console.log('========================================');

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(error);

              try {

                await page.screenshot({
                  path: 'fcc-error.png',
                  fullPage: true
                });

              } catch {}

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # COMMIT UPDATED STATE
      # ----------------------------------------

      - name: Save monitoring state
        run: |
          git config user.name "FCC Course Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fcc-catalogue-state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update FCC catalogue monitoring state"
            git push
          fi

      # ----------------------------------------
      # SAVE CATALOGUE HTML
      # ----------------------------------------

      - name: Save catalogue HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-catalogue
          path: fcc-catalogue-response.html
          retention-days: 3

      # ----------------------------------------
      # SAVE ERROR SCREENSHOT
      # ----------------------------------------

      - name: Save error screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-error
          path: fcc-error.png
          retention-days: 3
