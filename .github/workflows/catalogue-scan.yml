name: FCC Catalogue Structure Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL PLAYWRIGHT
      # ----------------------------------------

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # INSPECT FCC CATALOGUE
      # ----------------------------------------

      - name: Inspect FCC catalogue structure
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            try {

              console.log('========================================');
              console.log('FCC CATALOGUE STRUCTURE TEST');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('');
              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              const term = page.locator(
                'select[name="empower_global_term_id"]'
              );

              await term.selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              // ----------------------------------------
              // LEAVE DEPARTMENT BLANK
              // ----------------------------------------

              console.log('✓ Department: ALL');

              // ----------------------------------------
              // LEAVE COURSE BLANK
              // ----------------------------------------

              console.log('✓ Course: ALL');

              // ----------------------------------------
              // SEARCH
              // ----------------------------------------

              const search = page.locator(
                'button[name="search"]'
              );

              await search.waitFor({
                state: 'visible',
                timeout: 30000
              });

              await search.click();

              console.log('✓ Search clicked');

              // Give FCC time to populate everything.
              await page.waitForTimeout(5000);

              // ----------------------------------------
              // FIND ALL GRID ROWS
              // ----------------------------------------

              const rows = page.locator(
                'div.ui-grid-row'
              );

              const rowCount = await rows.count();

              console.log('');
              console.log('========================================');
              console.log('RAW GRID INFORMATION');
              console.log('========================================');

              console.log(
                `Total ui-grid-row elements: ${rowCount}`
              );

              // ----------------------------------------
              // INSPECT FIRST 30 ROWS
              // ----------------------------------------
              //
              // We deliberately only print the first
              // 30 rows so the GitHub log remains usable.
              //
              // ----------------------------------------

              const rowsToInspect =
                Math.min(rowCount, 30);

              console.log('');
              console.log(
                `Inspecting first ${rowsToInspect} grid rows...`
              );

              for (let i = 0; i < rowsToInspect; i++) {

                const row = rows.nth(i);

                const text = (await row.innerText())
                  .replace(/\u00a0/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();

                console.log('');
                console.log(
                  `========== GRID ROW ${i + 1} ==========`
                );

                console.log(
                  `TEXT: ${text}`
                );

                // ----------------------------------------
                // FIND CHILD GRID COLUMNS
                // ----------------------------------------

                const columns = row.locator(
                  'div[class*="ui-grid-col-"]'
                );

                const columnCount =
                  await columns.count();

                console.log(
                  `COLUMN COUNT: ${columnCount}`
                );

                for (
                  let c = 0;
                  c < columnCount;
                  c++
                ) {

                  const value =
                    (await columns.nth(c).innerText())
                      .replace(/\u00a0/g, ' ')
                      .replace(/\s+/g, ' ')
                      .trim();

                  console.log(
                    `COLUMN ${c + 1}: ${value}`
                  );

                }

              }

              // ----------------------------------------
              // FIND COURSE-LIKE ROWS
              // ----------------------------------------
              //
              // This checks how many grid rows contain
              // something that looks like a course code.
              //
              // We are NOT using this as the final parser.
              //
              // ----------------------------------------

              let courseLikeRows = 0;

              const courseSamples = [];

              for (let i = 0; i < rowCount; i++) {

                const row = rows.nth(i);

                const text = (await row.innerText())
                  .replace(/\u00a0/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();

                if (
                  /\b[A-Z]{2,6}\s*\d{3,4}\s+[A-Za-z0-9]+\b/
                    .test(text)
                ) {

                  courseLikeRows++;

                  if (courseSamples.length < 20) {

                    courseSamples.push(text);

                  }

                }

              }

              console.log('');
              console.log('========================================');
              console.log('COURSE-LIKE ROW TEST');
              console.log('========================================');

              console.log(
                `Rows containing a course-like code: ${courseLikeRows}`
              );

              console.log('');

              console.log(
                'Sample course-like rows:'
              );

              for (
                let i = 0;
                i < courseSamples.length;
                i++
              ) {

                console.log(
                  `${i + 1}. ${courseSamples[i]}`
                );

              }

              // ----------------------------------------
              // INSPECT THE RESULT CONTAINER HIERARCHY
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('RESULT CONTAINER INSPECTION');
              console.log('========================================');

              const firstCourseRow =
                rows.filter({
                  hasText: /\b[A-Z]{2,6}\s*\d{3,4}\s+[A-Za-z0-9]+\b/
                }).first();

              if (
                await firstCourseRow.count() > 0
              ) {

                console.log(
                  '✓ Found a course-like grid row.'
                );

                const tagName =
                  await firstCourseRow.evaluate(
                    element => element.tagName
                  );

                console.log(
                  `Row tag: ${tagName}`
                );

                const className =
                  await firstCourseRow.getAttribute(
                    'class'
                  );

                console.log(
                  `Row class: ${className}`
                );

                const parentInfo =
                  await firstCourseRow.evaluate(
                    element => {

                      const parent =
                        element.parentElement;

                      if (!parent) {
                        return null;
                      }

                      return {
                        tag: parent.tagName,
                        className:
                          parent.className,
                        childCount:
                          parent.children.length
                      };

                    }
                  );

                console.log(
                  'Parent information:'
                );

                console.log(
                  JSON.stringify(
                    parentInfo,
                    null,
                    2
                  )
                );

              } else {

                console.log(
                  '⚠ No course-like row found.'
                );

              }

              // ----------------------------------------
              // SAVE SCREENSHOT
              // ----------------------------------------

              await page.screenshot({
                path: 'fcc-catalogue-structure.png',
                fullPage: true
              });

              console.log('');
              console.log('========================================');
              console.log('STRUCTURE TEST COMPLETE');
              console.log('========================================');

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(error);

              try {

                await page.screenshot({
                  path: 'fcc-error.png',
                  fullPage: true
                });

              } catch {}

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # SAVE CATALOGUE SCREENSHOT
      # ----------------------------------------

      - name: Save catalogue screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-catalogue-structure
          path: fcc-catalogue-structure.png
          retention-days: 3

      # ----------------------------------------
      # SAVE ERROR SCREENSHOT
      # ----------------------------------------

      - name: Save error screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-error
          path: fcc-error.png
          retention-days: 3
