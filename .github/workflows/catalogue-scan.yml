name: FCC Catalogue Parser Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          npm install playwright cheerio
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # CAPTURE + PARSE FCC CATALOGUE
      # ----------------------------------------

      - name: Parse FCC catalogue
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            try {

              console.log('========================================');
              console.log('FCC CATALOGUE PARSER TEST');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('');
              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              await page.locator(
                'select[name="empower_global_term_id"]'
              ).selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              console.log('✓ Department: ALL');
              console.log('✓ Course: ALL');

              // ----------------------------------------
              // CAPTURE GETLIST RESPONSE
              // ----------------------------------------

              console.log('');
              console.log(
                'Waiting for FCC catalogue response...'
              );

              const responsePromise =
                page.waitForResponse(
                  response => {

                    return response.url()
                      .includes(
                        '/cfcs/courseCatalog.cfc?method=GetList'
                      );

                  },
                  {
                    timeout: 60000
                  }
                );

              // ----------------------------------------
              // SEARCH
              // ----------------------------------------

              await page.locator(
                'button[name="search"]'
              ).click();

              console.log('✓ Search clicked');

              const response =
                await responsePromise;

              console.log(
                `✓ GetList response received`
              );

              console.log(
                `Status: ${response.status()}`
              );

              // ----------------------------------------
              // READ RESPONSE
              // ----------------------------------------

              const responseText =
                await response.text();

              console.log(
                `Response size: ${responseText.length} characters`
              );

              let payload;

              try {

                payload =
                  JSON.parse(responseText);

              } catch (error) {

                throw new Error(
                  'FCC response was not valid JSON.'
                );

              }

              if (
                !payload.SUCCESS ||
                typeof payload.html !== 'string'
              ) {

                throw new Error(
                  'FCC response did not contain the expected SUCCESS/html structure.'
                );

              }

              const html = payload.html;

              console.log(
                `Catalogue HTML size: ${html.length} characters`
              );

              // ----------------------------------------
              // SAVE RAW CATALOGUE HTML
              // ----------------------------------------

              fs.writeFileSync(
                'fcc-catalogue-response.html',
                html
              );

              console.log(
                '✓ Raw catalogue HTML saved.'
              );

              // ----------------------------------------
              // PARSE HTML
              // ----------------------------------------

              const $ =
                cheerio.load(html);

              const rows =
                $('div.ui-grid-row');

              console.log('');
              console.log('========================================');
              console.log('CATALOGUE STRUCTURE');
              console.log('========================================');

              console.log(
                `Grid rows found: ${rows.length}`
              );

              // ----------------------------------------
              // HELPER
              // ----------------------------------------

              function clean(value) {

                return String(value || '')
                  .replace(/\u00a0/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();

              }

              function getColumns(row) {

                const values = [];

                $(row)
                  .find('div[class*="ui-grid-col-"]')
                  .each((index, element) => {

                    values.push(
                      clean($(element).text())
                    );

                  });

                return values;

              }

              function looksLikeCourse(value) {

                return /\b[A-Z]{2,6}\s*\d{3,4}\s+[A-Za-z0-9]+\b/
                  .test(value);

              }

              function extractCourse(value) {

                const match =
                  value.match(
                    /\b([A-Z]{2,6}\s*\d{3,4}\s+[A-Za-z0-9]+)\b/
                  );

                return match
                  ? clean(match[1])
                  : null;

              }

              // ----------------------------------------
              // BUILD RAW ROW OBJECTS
              // ----------------------------------------

              const parsedRows = [];

              rows.each((index, element) => {

                const columns =
                  getColumns(element);

                const text =
                  clean($(element).text());

                if (!text) {
                  return;
                }

                parsedRows.push({
                  index,
                  text,
                  columns,
                  isCourse:
                    looksLikeCourse(text),
                  course:
                    extractCourse(text)
                });

              });

              console.log(
                `Non-empty rows: ${parsedRows.length}`
              );

              console.log(
                `Course-start rows: ${
                  parsedRows.filter(
                    row => row.isCourse
                  ).length
                }`
              );

              // ----------------------------------------
              // GROUP CONTINUATION ROWS
              // ----------------------------------------

              const records = [];

              let current = null;

              for (const row of parsedRows) {

                if (row.isCourse) {

                  if (current) {
                    records.push(current);
                  }

                  current = {
                    sourceRow: row.index,
                    course: row.course,
                    rows: [
                      row
                    ]
                  };

                } else if (current) {

                  current.rows.push(row);

                }

              }

              if (current) {
                records.push(current);
              }

              console.log('');
              console.log('========================================');
              console.log('SECTION GROUPING');
              console.log('========================================');

              console.log(
                `Sections detected: ${records.length}`
              );

              const multiRowRecords =
                records.filter(
                  record =>
                    record.rows.length > 1
                );

              console.log(
                `Sections with continuation rows: ${
                  multiRowRecords.length
                }`
              );

              // ----------------------------------------
              // CONVERT GROUPS INTO STRUCTURED RECORDS
              // ----------------------------------------

              const sections = [];

              for (const record of records) {

                const first =
                  record.rows[0];

                const firstColumns =
                  first.columns;

                /*
                 * Normal FCC row observed in the
                 * network test:
                 *
                 * 1 = icon
                 * 2 = course
                 * 3 = credits
                 * 4 = location
                 * 5 = schedule
                 * 6 = instructor
                 * 7 = enrolled
                 * 8 = available
                 * 9 = offer
                 * 10 = details
                 */

                const section = {
                  section: record.course,
                  credits:
                    firstColumns[2] || '',
                  location:
                    firstColumns[3] || '',
                  schedules: [],
                  instructor:
                    firstColumns[5] || '',
                  enrolled:
                    firstColumns[6] || '',
                  available:
                    firstColumns[7] || '',
                  offer:
                    firstColumns[8] || '',
                  sourceRows:
                    record.rows.map(
                      row => row.index
                    )
                };

                // ----------------------------------------
                // EXTRACT DATA FROM EVERY ROW
                // ----------------------------------------

                for (
                  let r = 0;
                  r < record.rows.length;
                  r++
                ) {

                  const row =
                    record.rows[r];

                  const columns =
                    row.columns;

                  // Normal row schedule
                  if (
                    columns[4] &&
                    !section.schedules.includes(
                      columns[4]
                    )
                  ) {

                    section.schedules.push(
                      columns[4]
                    );

                  }

                  // Continuation row
                  //
                  // These commonly have:
                  // location + schedule + instructor
                  // and may also contain offer/available.
                  //

                  if (r > 0) {

                    if (
                      columns[0] &&
                      !section.location
                    ) {

                      section.location =
                        columns[0];

                    }

                    if (
                      columns[1] &&
                      !section.schedules.includes(
                        columns[1]
                      )
                    ) {

                      section.schedules.push(
                        columns[1]
                      );

                    }

                    if (
                      columns[2] &&
                      !section.instructor
                    ) {

                      section.instructor =
                        columns[2];

                    }

                    // If the continuation row contains
                    // numeric enrollment/availability
                    // values, retain them.
                    for (
                      let c = 0;
                      c < columns.length;
                      c++
                    ) {

                      const value =
                        columns[c];

                      if (
                        /^\d+$/.test(value)
                      ) {

                        if (
                          section.available === ''
                        ) {

                          section.available =
                            value;

                        } else if (
                          section.enrolled === ''
                        ) {

                          section.enrolled =
                            value;

                        }

                      }

                    }

                  }

                }

                sections.push(section);

              }

              // ----------------------------------------
              // PRINT FIRST 20 SECTIONS
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('FIRST 20 PARSED SECTIONS');
              console.log('========================================');

              for (
                let i = 0;
                i < Math.min(20, sections.length);
                i++
              ) {

                const section =
                  sections[i];

                console.log('');
                console.log(
                  `---------- SECTION ${i + 1} ----------`
                );

                console.log(
                  `Course: ${section.section}`
                );

                console.log(
                  `Credits: ${section.credits}`
                );

                console.log(
                  `Location: ${section.location}`
                );

                console.log(
                  `Schedules: ${
                    section.schedules.join(
                      ' | '
                    )
                  }`
                );

                console.log(
                  `Instructor: ${section.instructor}`
                );

                console.log(
                  `Enrolled: ${section.enrolled}`
                );

                console.log(
                  `Available: ${section.available}`
                );

                console.log(
                  `Offer: ${section.offer}`
                );

                console.log(
                  `Source rows: ${
                    section.sourceRows.join(
                      ', '
                    )
                  }`
                );

              }

              // ----------------------------------------
              // PRINT MULTI-ROW EXAMPLES
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('MULTI-ROW SECTION EXAMPLES');
              console.log('========================================');

              for (
                let i = 0;
                i < Math.min(
                  10,
                  multiRowRecords.length
                );
                i++
              ) {

                const record =
                  multiRowRecords[i];

                console.log('');
                console.log(
                  `---------- MULTI-ROW ${i + 1} ----------`
                );

                console.log(
                  `Course: ${record.course}`
                );

                console.log(
                  `Rows: ${
                    record.rows
                      .map(
                        row => row.index
                      )
                      .join(', ')
                  }`
                );

                for (
                  const row of record.rows
                ) {

                  console.log(
                    `ROW ${row.index}: ${
                      row.columns.join(
                        ' | '
                      )
                    }`
                  );

                }

              }

              // ----------------------------------------
              // SAVE STRUCTURED JSON
              // ----------------------------------------

              fs.writeFileSync(
                'fcc-sections.json',
                JSON.stringify(
                  sections,
                  null,
                  2
                )
              );

              console.log('');
              console.log(
                '✓ Structured sections saved.'
              );

              // ----------------------------------------
              // SUMMARY
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('PARSER TEST COMPLETE');
              console.log('========================================');

              console.log(
                `Raw rows: ${rows.length}`
              );

              console.log(
                `Non-empty rows: ${parsedRows.length}`
              );

              console.log(
                `Course starts: ${
                  parsedRows.filter(
                    row => row.isCourse
                  ).length
                }`
              );

              console.log(
                `Parsed sections: ${sections.length}`
              );

              console.log(
                `Multi-row sections: ${
                  multiRowRecords.length
                }`
              );

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(error);

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # SAVE RAW HTML
      # ----------------------------------------

      - name: Save raw catalogue HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-catalogue-response
          path: fcc-catalogue-response.html
          retention-days: 3

      # ----------------------------------------
      # SAVE STRUCTURED JSON
      # ----------------------------------------

      - name: Save parsed sections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-parsed-sections
          path: fcc-sections.json
          retention-days: 3
