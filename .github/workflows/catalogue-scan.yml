name: FCC Full Catalogue Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:

      # ----------------------------------------
      # CHECK OUT REPOSITORY
      # ----------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # SET UP NODE
      # ----------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          npm install playwright nodemailer
          npx playwright install --with-deps chromium

      # ----------------------------------------
      # CHECK FCC
      # ----------------------------------------

      - name: Check FCC course availability
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          const nodemailer = require('nodemailer');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              }
            });

            try {

              console.log('========================================');
              console.log('FCC FULL CATALOGUE MONITOR');
              console.log('========================================');

              // ----------------------------------------
              // OPEN FCC
              // ----------------------------------------

              console.log('Opening FCC...');

              await page.goto(
                'https://mysis-fccollege.empower-xl.com/fusebox.cfm?fuseaction=CourseCatalog&rpt=1',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              await page.waitForTimeout(2000);

              console.log('✓ FCC loaded');

              // ----------------------------------------
              // SELECT TERM
              // ----------------------------------------

              const term = page.locator(
                'select[name="empower_global_term_id"]'
              );

              await term.selectOption({
                label: '2026 Fall'
              });

              console.log('✓ Term: 2026 Fall');

              await page.waitForTimeout(1500);

              // ----------------------------------------
              // SEARCH FULL CATALOGUE
              // ----------------------------------------
              //
              // Department and course are intentionally
              // left blank so the entire catalogue is
              // returned.
              //
              // ----------------------------------------

              const search = page.locator(
                'button[name="search"]'
              );

              await search.waitFor({
                state: 'visible',
                timeout: 30000
              });

              await search.click();

              console.log('✓ Full catalogue search clicked');

              await page.waitForTimeout(5000);

              // ----------------------------------------
              // SAVE FULL HTML SNAPSHOT
              // ----------------------------------------
              //
              // This captures the complete HTML currently
              // loaded in the browser after the catalogue
              // search has completed.
              //
              // We are saving this temporarily so we can
              // inspect FCC's actual catalogue structure
              // and make the parser more reliable.
              //
              // ----------------------------------------

              const catalogueHtml =
                await page.content();

              fs.writeFileSync(
                'fcc-catalogue-response.html',
                catalogueHtml,
                'utf8'
              );

              console.log(
                `✓ Full catalogue HTML saved (${catalogueHtml.length} characters)`
              );

              // ----------------------------------------
              // FIND ALL CATALOGUE ROWS
              // ----------------------------------------

              const rows = page.locator(
                'div.ui-grid-row'
              );

              const rowCount = await rows.count();

              console.log(
                `Raw catalogue rows: ${rowCount}`
              );

              const sections = [];
              let courseRowsRecognized = 0;
              let courseRowsUnrecognized = 0;

              // ----------------------------------------
              // PARSE COURSE CODE
              // ----------------------------------------
              //
              // Supports:
              //
              // ARTS 101 A
              // BIOT 699A A
              // CHEM 799E B
              // COMP 497A A
              // PHYS COMP A
              //
              // No fixed total number of sections.
              //
              // ----------------------------------------

              function extractCourse(value) {

                const match =
                  value.match(
                    /\b([A-Z]{2,6}\s+[A-Z0-9]{3,6}\s+[A-Za-z0-9]+)\b/i
                  );

                return match
                  ? match[1]
                      .replace(/\s+/g, ' ')
                      .trim()
                      .toUpperCase()
                  : null;
              }

              // ----------------------------------------
              // PARSE ALL ROWS
              // ----------------------------------------

              for (let i = 0; i < rowCount; i++) {

                const row = rows.nth(i);

                const text = (await row.innerText())
                  .replace(/\u00a0/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();

                const columns = row.locator(
                  'div[class*="ui-grid-col-"]'
                );

                const columnCount = await columns.count();

                if (columnCount < 8) {
                  continue;
                }

                const values = [];

                for (let c = 0; c < columnCount; c++) {

                  const value =
                    (await columns.nth(c).innerText())
                      .replace(/\u00a0/g, ' ')
                      .replace(/\s+/g, ' ')
                      .trim();

                  values.push(value);
                }

                /*
                 * FCC structure:
                 *
                 * 1 = icon
                 * 2 = course
                 * 3 = credits
                 * 4 = location
                 * 5 = schedule
                 * 6 = instructor
                 * 7 = enrolled
                 * 8 = available
                 * 9 = offer
                 * 10 = details
                 */

                const courseText =
                  values[1] || '';

                const location =
                  values[3] || '';

                const schedule =
                  values[4] || '';

                const instructor =
                  values[5] || '';

                const enrolled =
                  values[6] || '';

                const available =
                  values[7] || '';

                const offer =
                  values[8] || '';

                // ----------------------------------------
                // EXTRACT COURSE + SECTION
                // ----------------------------------------

                const course =
                  extractCourse(courseText);

                if (!course) {

                  /*
                   * Count rows that look like they may
                   * contain course information but could
                   * not be parsed.
                   */

                  if (
                    /^[A-Z]{2,6}\s+[A-Z0-9]{3,6}/i.test(
                      courseText.trim()
                    )
                  ) {

                    courseRowsUnrecognized++;

                  }

                  continue;
                }

                courseRowsRecognized++;

                sections.push({
                  section: course,
                  location,
                  schedule,
                  instructor,
                  enrolled,
                  available,
                  offer
                });
              }

              // ----------------------------------------
              // REMOVE DUPLICATE SECTIONS
              // ----------------------------------------

              const uniqueSections = [];

              const seenSections =
                new Set();

              for (const section of sections) {

                if (
                  seenSections.has(
                    section.section
                  )
                ) {
                  continue;
                }

                seenSections.add(
                  section.section
                );

                uniqueSections.push(
                  section
                );
              }

              // ----------------------------------------
              // PRINT CURRENT RESULTS
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('CATALOGUE PARSING RESULTS');
              console.log('========================================');

              console.log(
                `Raw catalogue rows: ${rowCount}`
              );

              console.log(
                `Course rows recognized: ${courseRowsRecognized}`
              );

              console.log(
                `Course rows unrecognized: ${courseRowsUnrecognized}`
              );

              console.log(
                `Unique catalogue sections: ${uniqueSections.length}`
              );

              // ----------------------------------------
              // LOAD PREVIOUS STATE
              // ----------------------------------------

              const stateFile =
                'fcc-catalogue-state.json';

              let previousState = null;

              if (
                fs.existsSync(stateFile)
              ) {

                try {

                  previousState =
                    JSON.parse(
                      fs.readFileSync(
                        stateFile,
                        'utf8'
                      )
                    );

                  console.log('');
                  console.log(
                    '✓ Previous state loaded.'
                  );

                } catch {

                  console.log('');
                  console.log(
                    '⚠ Previous state could not be read.'
                  );

                }

              } else {

                console.log('');
                console.log(
                  'No previous state found. This run will establish the baseline.'
                );

              }

              const previousSectionCount =
                previousState
                  ? Object.keys(
                      previousState.sections || {}
                    ).length
                  : 0;

              // ----------------------------------------
              // SAFETY CHECK
              // ----------------------------------------
              //
              // No fixed catalogue size is assumed.
              //
              // If the current scan suddenly contains
              // less than 80% of the previous catalogue,
              // treat it as a bad/suspicious scrape.
              //
              // ----------------------------------------

              if (
                previousState &&
                previousSectionCount >= 100 &&
                uniqueSections.length <
                  previousSectionCount * 0.8
              ) {

                throw new Error(
                  `Suspicious catalogue drop detected. Previous sections: ${previousSectionCount}. Current sections: ${uniqueSections.length}. State file will NOT be overwritten.`
                );

              }

              // ----------------------------------------
              // BUILD CURRENT STATE
              // ----------------------------------------

              const currentState = {
                updatedAt:
                  new Date().toISOString(),

                sections: {}
              };

              for (
                const section of uniqueSections
              ) {

                const available =
                  parseInt(
                    section.available,
                    10
                  ) || 0;

                currentState.sections[
                  section.section
                ] = {
                  available,
                  enrolled:
                    section.enrolled,
                  location:
                    section.location,
                  schedule:
                    section.schedule,
                  instructor:
                    section.instructor,
                  offer:
                    section.offer
                };

              }

              // ----------------------------------------
              // DETECT CHANGES
              // ----------------------------------------

              let newSections = [];
              let newlyAvailable = [];

              if (previousState) {

                for (
                  const section
                    of uniqueSections
                ) {

                  const available =
                    parseInt(
                      section.available,
                      10
                    ) || 0;

                  const previous =
                    previousState.sections?.[
                      section.section
                    ];

                  // Completely new section

                  if (!previous) {

                    newSections.push(
                      section
                    );

                  }

                  // Existing section went
                  // from 0 to >0

                  if (
                    previous &&
                    previous.available === 0 &&
                    available > 0
                  ) {

                    newlyAvailable.push(
                      section
                    );

                  }

                }

              }

              // ----------------------------------------
              // DISPLAY CHANGES
              // ----------------------------------------

              console.log('');
              console.log('========================================');
              console.log('CHANGES');
              console.log('========================================');

              console.log(
                `Previous sections: ${previousSectionCount}`
              );

              console.log(
                `Current sections: ${uniqueSections.length}`
              );

              console.log(
                `New sections: ${newSections.length}`
              );

              console.log(
                `Newly available: ${newlyAvailable.length}`
              );

              // ----------------------------------------
              // SEND ALERT
              // ----------------------------------------

              if (
                newSections.length > 0 ||
                newlyAvailable.length > 0
              ) {

                const alertSections = [];

                // New sections

                for (
                  const section
                    of newSections
                ) {

                  alertSections.push({
                    ...section,
                    reason: 'NEW SECTION'
                  });

                }

                // Newly available seats

                for (
                  const section
                    of newlyAvailable
                ) {

                  const alreadyIncluded =
                    alertSections.some(
                      item =>
                        item.section ===
                        section.section
                    );

                  if (
                    !alreadyIncluded
                  ) {

                    alertSections.push({
                      ...section,
                      reason:
                        'SEATS AVAILABLE'
                    });

                  }

                }

                let emailText =
                  'FCC COURSE ALERT\n\n';

                emailText +=
                  '2026 Fall - Full Catalogue\n\n';

                for (
                  const section
                    of alertSections
                ) {

                  emailText +=
                    '----------------------------------------\n';

                  emailText +=
                    `${section.reason}\n`;

                  emailText +=
                    `${section.section}\n`;

                  emailText +=
                    `Location: ${section.location}\n`;

                  emailText +=
                    `Schedule: ${section.schedule}\n`;

                  emailText +=
                    `Instructor: ${section.instructor}\n`;

                  emailText +=
                    `Enrolled: ${section.enrolled}\n`;

                  emailText +=
                    `Available: ${section.available}\n`;

                  emailText +=
                    `Offer: ${section.offer}\n\n`;

                }

                emailText +=
                  'Check the FCC course catalogue now.';

                // ----------------------------------------
                // GMAIL
                // ----------------------------------------

                console.log('');
                console.log(
                  'Sending alert email...'
                );

                const transporter =
                  nodemailer.createTransport({
                    service: 'gmail',
                    auth: {
                      user:
                        process.env.SMTP_USER,

                      pass:
                        process.env.SMTP_PASSWORD
                    }
                  });

                await transporter.sendMail({

                  from:
                    process.env.SMTP_USER,

                  to:
                    process.env.ALERT_EMAIL,

                  subject:
                    '🚨 FCC Alert: Course catalogue update',

                  text:
                    emailText

                });

                console.log(
                  '✓ Alert email sent successfully.'
                );

              } else {

                console.log('');
                console.log(
                  'No new sections or newly available seats.'
                );

              }

              // ----------------------------------------
              // SAVE CURRENT STATE
              // ----------------------------------------

              fs.writeFileSync(
                stateFile,
                JSON.stringify(
                  currentState,
                  null,
                  2
                )
              );

              console.log(
                '✓ Current state saved.'
              );

              // ----------------------------------------
              // SCREENSHOT
              // ----------------------------------------

              await page.screenshot({
                path:
                  'fcc-course-results.png',

                fullPage:
                  true
              });

              console.log('');
              console.log('========================================');
              console.log('MONITOR COMPLETE');
              console.log('========================================');

            } catch (error) {

              console.error('');
              console.error('========================================');
              console.error('ERROR');
              console.error('========================================');

              console.error(
                error
              );

              try {

                await page.screenshot({
                  path:
                    'fcc-error.png',

                  fullPage:
                    true
                });

              } catch {}

              process.exit(1);

            } finally {

              await browser.close();

            }

          })();
          EOF

      # ----------------------------------------
      # COMMIT UPDATED STATE
      # ----------------------------------------

      - name: Save monitoring state
        run: |
          git config user.name "FCC Course Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fcc-catalogue-state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update FCC catalogue monitoring state"
            git push
          fi

      # ----------------------------------------
      # SAVE RAW FCC HTML
      # ----------------------------------------

      - name: Save raw FCC catalogue HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-catalogue-html
          path: fcc-catalogue-response.html
          retention-days: 3

      # ----------------------------------------
      # SAVE SCREENSHOT
      # ----------------------------------------

      - name: Save course results screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-course-results
          path: fcc-course-results.png
          retention-days: 3

      # ----------------------------------------
      # SAVE ERROR SCREENSHOT
      # ----------------------------------------

      - name: Save error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-error
          path: fcc-error.png
          retention-days: 3
